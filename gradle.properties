mod_description=Real life in Minecraft. Phase 1: your body (thirst, sleep, stamina, muscle tears, broken legs, burns, frostbite). Phase 2: blood (bleeding, blood types, bandages, tourniquets, transfusions). Phase 3: the hospital (doctors, surgery, burn cream, splints) and fiberglass insulation. Phase 4: the mind (mood, depression, games, TV, therapy, a real-date calendar). Phase 5: tech (build your own PC from parts, operating systems, laptops, the AI data center). Phase 6: no reviving (collapse, defibrillator, ambulance, gone for good). Phase 7: real computers (apps, software discs, a Mac-style lineup from 1984 to the M6). Phase 8: the world (countries, government, money, ATMs, phones and signal towers). 1.0.0: eras (year 0 or 2026, inventions, black and white, fancy clothes), radiation and diseases, electricity, Grandma's Stove, the workbench, voice-only chat, VR burns, echo, a drivable ambulance, the patient monitor, Chromeflesh surgery and the law. 1.2.0: player surgeons, dragging the collapsed, knives (swords become knives from 1900), cutting food, Czech food, murder evidence (witnesses, fingerprints, forensics).
